[package]
name = "brainpod-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "brainpod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.2"
getrandom = "0.3.4"
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.20.0"
tokio = { version = "1.52.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }
toml = "0.9.5"
webbrowser = "=1.0.6"
