name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            package: default
            runner: ubuntu-latest
            artifact: brainpod-amd64-linux
            archive: brainpod-amd64-linux.tar.gz
          - system: x86_64-darwin
            package: default
            runner: macos-14
            artifact: brainpod-amd64-macos
            archive: brainpod-amd64-macos.tar.gz
          - system: aarch64-linux
            package: default
            runner: ubuntu-24.04-arm
            artifact: brainpod-arm64-linux
            archive: brainpod-arm64-linux.tar.gz
          - system: aarch64-darwin
            package: default
            runner: macos-14
            artifact: brainpod-arm64-macos
            archive: brainpod-arm64-macos.tar.gz
          - system: x86_64-linux
            package: windows
            runner: ubuntu-latest
            artifact: brainpod-amd64-windows
            archive: brainpod-amd64-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-v1-${{ matrix.system }}-${{ matrix.package }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-v1-${{ matrix.system }}-${{ matrix.package }}-
          gc-max-store-size: 2G

      - name: Build
        run: nix build ".#packages.${{ matrix.system }}.${{ matrix.package }}"

      - name: Package Unix binary
        if: matrix.package == 'default'
        run: |
          mkdir package
          cp -L result/bin/brainpod package/brainpod
          tar -C package -czf "${{ matrix.archive }}" brainpod

      - name: Package Windows binary
        if: matrix.package == 'windows'
        run: |
          mkdir package
          cp -L result/bin/brainpod.exe package/brainpod.exe
          cd package
          zip "../${{ matrix.archive }}" brainpod.exe

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
