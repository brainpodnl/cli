name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            artifact: brainpod-amd64-linux
          - system: x86_64-darwin
            runner: macos-14
            artifact: brainpod-amd64-macos
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            artifact: brainpod-arm64-linux
          - system: aarch64-darwin
            runner: macos-14
            artifact: brainpod-arm64-macos

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-v1-${{ matrix.system }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-v1-${{ matrix.system }}-
          gc-max-store-size: 2G

      - name: Build
        run: nix build ".#packages.${{ matrix.system }}.default"

      - name: Package
        run: |
          mkdir package
          cp -L result/bin/brainpod package/brainpod
          tar -C package -czf "${{ matrix.artifact }}.tar.gz" brainpod

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
