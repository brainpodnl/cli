[catalog.scan]
ignore = [".git", ".jj", ".svn", "node_modules", "vendor", "target", ".venv", ".gradle", ".vs", "venv", "__pycache__", ".next", ".nuxt", ".output", "dist", "build", "coverage", ".bundle", ".brainpod", ".cache", "site-packages"]

[[catalog.scan.prune]]
when_files = ["*.csproj"]
directories = ["bin", "obj"]

[catalog.families]
javascript = "node"
typescript = "node"

[[catalog.inheritance]]
kind = "pin"

[[catalog.inheritance]]
kind = "toolchain"

[[catalog.inheritance]]
kind = "sdk"
boundary_files = ["global.json"]

