any = ["dep:maven:io.micronaut:micronaut-runtime", "dep:gradle-plugin:io.micronaut.application", "identity:maven:io.micronaut:micronaut-runtime"]

[[rules]]
id = "hono"
language = "typescript"
kind = "framework"
priority = 100
any = ["dep:npm:hono", "identity:npm:hono", "dep:jsr:@hono/hono", "identity:jsr:@hono/hono", "dep:deno:hono"]

[[catalog.environment]]
format = "dotenv"
files = [".env", ".env.*", "*.env", "*.env.example", "*.env.sample", "*.env.template"]
exclude = ["*.enc", ".env.vault"]

[[catalog.environment]]
format = "compose"
files = ["compose.yml", "compose.yaml", "compose.*.yml", "compose.*.yaml", "docker-compose.yml", "docker-compose.yaml", "docker-compose.*.yml", "docker-compose.*.yaml"]

[[catalog.environment]]
format = "dockerfile"
files = ["Dockerfile", "Dockerfile.*", "*.Dockerfile"]

[[catalog.environment]]
format = "github-actions"
files = ["*.yml", "*.yaml"]
paths = ["**/.github/workflows/*.yml", "**/.github/workflows/*.yaml"]

[[catalog.environment]]
format = "kubernetes"
files = ["*.yml", "*.yaml", "*.json"]
paths = ["**/k8s/**", "**/kubernetes/**", "**/kube/**", "**/manifests/**", "**/deploy/**", "**/deployment/**", "**/deployments/**"]

[[catalog.environment]]
format = "kubernetes"
files = ["pod.yaml", "pod.yml", "deployment.yaml", "deployment.yml", "*.k8s.yaml", "*.k8s.yml", "*.kube.yaml", "*.kube.yml", "kubernetes-*.yaml", "kubernetes-*.yml"]

[[catalog.environment]]
format = "kubernetes"
files = ["*.k8s.json", "*.kube.json"]

# Platform deployment manifests. Listed after the generic entries so a file in a
# Kubernetes metadata directory keeps its Kubernetes routing.
[[catalog.environment]]
format = "app-json"
files = ["app.json", "scalingo.json"]

[[catalog.environment]]
format = "heroku-yml"
files = ["heroku.yml"]

[[catalog.environment]]
format = "render"
files = ["render.yaml"]

[[catalog.environment]]
format = "fly"
files = ["fly.toml", "fly.*.toml"]

[[catalog.environment]]
format = "digitalocean"
files = ["app.yaml", "deploy.template.yaml"]
paths = ["**/.do/app.yaml", "**/.do/deploy.template.yaml"]

[[catalog.environment]]
format = "vercel"
files = ["vercel.json", "vercel.toml"]

[[catalog.environment]]
format = "netlify"
files = ["netlify.toml"]

[[catalog.environment]]
format = "app-engine"
files = ["app.yaml"]

[[catalog.environment]]
format = "copilot"
files = ["manifest.yml", "manifest.yaml"]
paths = ["**/copilot/*/manifest.yml", "**/copilot/*/manifest.yaml"]

# Literal code references to environment names that platforms inject or
# frameworks expose by documented convention (`--with-env` only). Patterns match
# whole identifier tokens: exact `names`, or `prefixes` followed by [A-Z0-9_]+.
# `signals` gate generic names on a platform file existing anywhere in the scan;
# `requires` gates on a detection id of the owning project. First passing
# candidate wins. `docs` cites the primary source for each list.
[catalog.code_references]
extensions = ["js", "jsx", "mjs", "cjs", "ts", "tsx", "mts", "cts", "vue", "svelte", "astro", "py", "rb", "go", "rs", "php", "java", "kt", "kts", "cs", "ex", "exs"]
exclude = ["*.min.js", "*.min.mjs", "*.min.cjs", "*.bundle.js"]

[[catalog.code_references.patterns]]
origin = "framework"
provider = "nextjs"
prefixes = ["NEXT_PUBLIC_"]
scope = "build"
docs = ["https://nextjs.org/docs/app/guides/environment-variables#bundling-environment-variables-for-the-browser"]

[[catalog.code_references.patterns]]
origin = "framework"
provider = "vite"
prefixes = ["VITE_"]
