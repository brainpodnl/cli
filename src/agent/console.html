<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainpod session</title>
<style>
/*@@SHELL@@*/
/*@@CONSOLE@@*/
:root { --core: #dbe6ff; --core-alpha: .78; --bloom-alpha: .34; --blade-alpha: 76%; }
@media (prefers-color-scheme: dark) {
  :root { --core: #f2f6ff; --core-alpha: .88; --bloom-alpha: .5; --blade-alpha: 88%; }
}
</style>
</head>
<body data-run="running">

<div class="confetti" id="burst" aria-hidden><!--@@CONFETTI@@--></div>

<main class="card">
  <div class="chrome">
    <svg viewBox="0 0 19.89 21.47" aria-hidden><path fill="currentColor" d="M6.14451 14.0293C6.40601 10.6845 9.10699 7.98496 12.4518 7.72417C13.9056 7.61047 15.2721 7.95227 16.4275 8.6181C19.3971 3.77042 16.8525 0 11.8044 0H0.974935C0.436304 0 0 0.436305 0 0.974936V19.7588C0 20.2377 0.348192 20.6485 0.821449 20.7217C3.05485 21.0677 5.18734 20.5604 7.5785 18.8087C6.56306 17.5091 6.00382 15.8363 6.14451 14.0293Z"/><path fill="#003399" d="M16.4282 8.61755C16.2939 8.83642 16.1497 9.05812 15.9926 9.28125C12.6742 13.9989 9.9938 17.0395 7.57849 18.8096C8.83767 20.422 10.7982 21.4601 13.0018 21.4601C16.8006 21.4601 19.8803 18.3804 19.8803 14.5816C19.8803 12.0305 18.4904 9.80567 16.4282 8.61755Z"/></svg>
    <span class="wordmark">Brainpod</span>
    <span class="badge" id="badge"><span class="dot"></span><span id="badge-text">starting</span></span>
  </div>

  <div class="body">
    <h1 id="headline">Getting started.</h1>
    <p class="lead" id="lead"></p>

    <div class="bar">
      <svg class="hilt" viewBox="0 0 84 26" aria-hidden>
        <defs>
          <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6f6b64"/><stop offset=".13" stop-color="#cdc8c0"/>
            <stop offset=".27" stop-color="#fbf9f6"/><stop offset=".42" stop-color="#c8c3bb"/>
            <stop offset=".6" stop-color="#8b867e"/><stop offset=".83" stop-color="#4c4842"/>
            <stop offset="1" stop-color="#6b665f"/>
          </linearGradient>
          <linearGradient id="ebony" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#35322e"/><stop offset=".25" stop-color="#58544d"/>
            <stop offset=".55" stop-color="#2a2724"/><stop offset="1" stop-color="#141312"/>
          </linearGradient>
          <radialGradient id="ember" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#4d7dff" stop-opacity=".85"/>
            <stop offset=".55" stop-color="#003399" stop-opacity=".32"/>
            <stop offset="1" stop-color="#003399" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse class="hilt-glow" cx="80" cy="13" rx="11" ry="13" fill="url(#ember)"/>
        <rect x=".5" y="8.4" width="6" height="9.2" rx="2.4" fill="url(#chrome)"/>
        <rect x="6" y="8.1" width="1.7" height="9.8" rx=".6" fill="url(#ebony)"/>
        <rect x="7.4" y="9.1" width="8.4" height="7.8" rx="1.5" fill="url(#chrome)"/>
        <rect x="15.4" y="8.1" width="1.9" height="9.8" rx=".6" fill="url(#ebony)"/>
        <rect x="17" y="7.7" width="24" height="10.6" rx="1.4" fill="url(#ebony)"/>
        <rect x="18.5" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="21.3" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="24.1" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="26.9" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="29.7" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="32.5" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="35.3" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="38.1" y="7.7" width="1.35" height="10.6" fill="url(#chrome)" opacity=".92"/>
        <rect x="41" y="7.9" width="2.2" height="10.2" rx=".7" fill="url(#chrome)"/>
        <rect x="43" y="5.3" width="12.4" height="15.4" rx="1.8" fill="url(#chrome)"/>
        <rect x="45.4" y="7" width="4" height="2.8" rx="1" fill="#b4402f"/>
        <rect x="50.2" y="7" width="3.4" height="2.8" rx=".8" fill="url(#ebony)"/>
        <rect x="45.4" y="15.8" width="8.2" height="1.3" rx=".6" fill="url(#ebony)" opacity=".9"/>
        <rect x="45.4" y="17.6" width="8.2" height="1.3" rx=".6" fill="url(#ebony)" opacity=".9"/>
        <rect x="55.2" y="7.5" width="4.2" height="11" rx="1" fill="url(#chrome)"/>
        <rect x="57.4" y="7.5" width="1.2" height="11" fill="url(#ebony)" opacity=".75"/>
        <rect x="59.2" y="8.6" width="3.8" height="8.8" rx="1" fill="url(#ebony)"/>
        <rect x="62.6" y="4.5" width="10" height="17" rx="2" fill="url(#chrome)"/>
        <rect x="72" y="6.1" width="9.2" height="13.8" rx="1.2" fill="url(#chrome)"/>
        <rect x="73.3" y="6.1" width="1.1" height="13.8" fill="url(#ebony)" opacity=".88"/>
        <rect x="75.3" y="6.1" width="1.1" height="13.8" fill="url(#ebony)" opacity=".88"/>
        <rect x="77.3" y="6.1" width="1.1" height="13.8" fill="url(#ebony)" opacity=".88"/>
        <rect x="79.3" y="6.1" width="1.1" height="13.8" fill="url(#ebony)" opacity=".88"/>
        <rect x="80.6" y="7.3" width="2.6" height="11.4" rx="1" fill="url(#chrome)"/>
        <rect x="81.8" y="9.7" width="2.2" height="6.6" rx="1.1" fill="#1b1917"/>
      </svg>
      <div class="track">
        <span class="saber" id="blade"></span>
        <span class="segments" id="segments" aria-hidden></span>
      </div>
    </div>

    <div class="rail" id="rail"></div>

    <section class="out" id="out" aria-live="polite">
      <h3>Output</h3>
      <div class="lines" id="lines"></div>
    </section>

    <div class="row landing" id="landing">
      <a class="btn" id="visit" href="#">Open the pod page
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </div>
  </div>

  <div class="foot">
    <span id="foot">Waiting on your agent, not on you.</span>
    <a class="sep" href="https://brainpod.io">brainpod.io &rarr;</a>
  </div>
</main>

<script>
(() => {
  "use strict";

  /* Nothing heartbeats between milestones except the commands themselves, and a
     minute of silence during a build is normal. Matches deploy --wait's
     default timeout, so a genuinely stuck deploy still surfaces. */
  const STALE_AFTER = 90000;
  const POLL = 400;

  const TICK = '<svg class="tick" viewBox="0 0 16 16" aria-hidden><circle cx="8" cy="8" r="8"/><path d="M4.6 8.2 6.9 10.5 11.4 6"/></svg>';
  const PIP = '<span class="pip"></span>';

  const el = (id) => document.getElementById(id);
  const body = document.body;
  const rail = el("rail"), lines = el("lines"), out = el("out");
  const blade = el("blade"), segments = el("segments"), burst = el("burst");
  const landing = el("landing"), visit = el("visit");

  let session = null, flared = false, latest = null, pushed = null, refused = null, drawn = "";

  const escape = (text) => {
    const node = document.createElement("div");
    node.textContent = text;
    return node.innerHTML;
  };

  function reset(state) {
    session = state.session;
    tail.at = 0;
    tail.text = "";
    tail.seen = 0;
    tail.decoder = new TextDecoder();
    flared = false;
    rail.innerHTML = "";
    drawn = "";
    lines.innerHTML = "";
    segments.innerHTML = "";
    out.classList.remove("on");
    landing.classList.remove("on");
    blade.classList.remove("flare");
    blade.style.transition = "none";
    blade.style.width = "0%";
    void blade.offsetWidth;
    blade.style.transition = "";
    /* Stays hidden until the deploy lands: display:none is also what keeps the
       animation from having already played by the time it should fire. */
    burst.style.display = "none";
  }

  function paintRail(state, stalled) {
    if (segments.children.length !== state.steps.length) {
      segments.innerHTML = state.steps.map(() => "<i></i>").join("");
    }

    const markup = state.steps.map((step) => {
      const live = stalled && step.state === "running" ? "stalled" : step.state;
      const klass = { done: "is-done", running: "is-now", failed: "is-fail", stalled: "is-stall" }[live] || "is-todo";
      const mark = live === "done" ? TICK : PIP;
      const when = live === "running" ? ' <span class="when">now</span>'
        : step.startedAt && step.endedAt && step.endedAt - step.startedAt >= 1000
          ? ' <span class="when">' + Math.round((step.endedAt - step.startedAt) / 1000) + 's</span>'
          : "";
      const detail = step.detail ? "<p>" + escape(step.detail) + "</p>" : "";
      return '<div class="step ' + klass + '"><span class="mark">' + mark + "</span>" +
             "<div><h2>" + escape(step.label) + when + "</h2>" + detail + "</div></div>";
    }).join("");

    /* Only touch the DOM when something actually changed. Rewriting it on every
       poll replaces the running step's element, and a CSS animation restarts
       from zero each time its element is recreated — which is why the spinner
       sat still. Compared against what was last generated, not against
       innerHTML: reading that back returns the browser's normalised markup,
       which never equals the string that produced it. */
    if (markup !== drawn) {
      drawn = markup;
      rail.innerHTML = markup;
    }

    const done = state.steps.filter((s) => s.state === "done").length;
    blade.style.width = state.steps.length ? (done / state.steps.length) * 100 + "%" : "0%";
  }

  /* One reader for both ways this page is delivered: the URL is relative, so
     ./session.log is the sibling file when opened locally and a served route
     when it is not. One log rather than one per source, because separate files
     carry no timestamps and nothing could put them back in order. */
  /* `seen` is when the log last grew. Output arriving is proof the workflow is
     alive, and during a long build or push it is the only proof there is: the
     session file is only rewritten when a step changes, which can be minutes
     apart while plenty is happening. */
  const tail = { at: 0, text: "", busy: false, seen: 0, decoder: new TextDecoder() };

  async function readLog() {
    if (tail.busy) return;
    tail.busy = true;

    /* Ranges are only trustworthy when served: opened as a local file the range
       is honoured but answered 200 with no Content-Range, which is
       indistinguishable from the whole file. Re-reading a local file is cheap,
       so only tail by offset over HTTP. */
    const ranged = location.protocol !== "file:" && tail.at > 0;

    try {
      const response = await fetch("./session.log", {
        cache: "no-store",
        headers: ranged ? { Range: "bytes=" + tail.at + "-" } : {},
      });
      if (!response.ok) { tail.busy = false; return; }

      const buffer = await response.arrayBuffer();
      const partial = ranged && response.status === 206;
      if (!partial) tail.decoder = new TextDecoder();
      const chunk = tail.decoder.decode(buffer, { stream: true });

      tail.text = partial ? tail.text + chunk : chunk;
      /* Offsets are byte counts; a JS string length is not one once anything
         outside ASCII shows up in a build log. */
      const range = response.headers.get("Content-Range");
      const size = range
        ? Number(range.split("/")[1])
        : partial
          ? tail.at + buffer.byteLength
          : buffer.byteLength;
      /* Growth, not arrival: read whole from a file:// page, every poll returns
         the same bytes again and would look like activity forever. */
      if (size > tail.at) tail.seen = Date.now();
      tail.at = size;

      if (tail.text.length > 400000) tail.text = tail.text.slice(-400000);
      render();
    } catch (error) {
      /* Transient while the file is being appended to. */
    }
    tail.busy = false;
  }

  function render() {
    const text = tail.text.replace(/\s+$/, "");
    if (!text) { out.classList.remove("on"); return; }
    out.classList.add("on");

    const stuck = lines.scrollHeight - lines.scrollTop - lines.clientHeight < 40;
    lines.innerHTML = text
      .split("\n")
      .map((line) => {
        const tag = line.match(/^\[([A-Za-z0-9_-]{1,40})\] ?/);
        return tag
          ? '<i>' + escape(tag[1]) + "</i>" + escape(line.slice(tag[0].length))
          : escape(line);
      })
      .join("\n");
    if (stuck) lines.scrollTop = lines.scrollHeight;
  }

  function paint(state) {
    if (state.session !== session) reset(state);

    const alive = Math.max(state.updatedAt, tail.seen);
    const stalled = state.state === "running" && Date.now() - alive > STALE_AFTER;
    const run = stalled ? "stalled" : state.state;
    body.dataset.run = run;
    el("badge").className = "badge" + (run === "failed" ? " is-fail" : run === "stalled" ? " is-warn" : "");
    el("badge-text").textContent = state.pod || run;

    paintRail(state, stalled);
    readLog();

    const running = state.steps.find((s) => s.state === "running");
    const failed = state.steps.find((s) => s.state === "failed");

    if (state.state === "done") {
      el("headline").textContent = "Your app is live.";
      el("lead").textContent = state.message || "Everything is deployed and serving traffic.";
      el("foot").textContent = "Your pod keeps running after this session ends.";
      blade.style.width = "100%";
      if (!flared) { flared = true; blade.classList.add("flare"); burst.style.display = "block"; }
      if (state.podUrl) { visit.href = state.podUrl; landing.classList.add("on"); }
    } else if (state.state === "failed") {
      el("headline").textContent = "The deploy stopped.";
      el("lead").textContent = state.message || (failed && failed.detail) ||
        "Nothing was deployed. Your pod is exactly as it was.";
      el("foot").textContent = "Nothing was deployed.";
      burst.style.display = "none";
    } else if (stalled) {
      el("foot").textContent =
        "Last update " + Math.round((Date.now() - alive) / 1000) + "s ago.";
      burst.style.display = "none";
    } else {
      el("headline").textContent = running ? running.label : "Getting started.";
      el("lead").textContent = running && running.detail ? running.detail : "";
      el("foot").textContent = "Waiting on your agent, not on you.";
    }
  }

  async function refresh() {
    try {
      const response = await fetch("./session.json", { cache: "no-store" });
      if (response.ok) latest = await response.json();
    } catch (error) {
      /* The file is replaced by rename, so a failed read is transient. */
    }
    if (latest) paint(latest);
  }

  /* Push where a server is running, polling everywhere else. The events only
     say something moved; the page then re-reads exactly what it reads when
     polling, so there is one code path either way. */
  /* A stream that never opened is not one to keep trying. Opened as a local
     file this page is a different origin from the server, and the browser will
     refuse the stream every time it is offered — which, without this, is every
     poll for as long as the console is up. One that opened and then dropped is
     a server restart, and worth reconnecting to. */
  function listen(url) {
    if (pushed === url || refused === url) return;
    pushed = url;
    let opened = false;
    const source = new EventSource(url);
    source.onopen = () => { opened = true; };
    source.onmessage = refresh;
    source.onerror = () => {
      source.close();
      pushed = null;
      if (!opened) refused = url;
    };
  }

  async function loop() {
    await refresh();
    if (latest && latest.events) listen(latest.events);
    setTimeout(loop, pushed ? 5000 : POLL);
  }

  burst.style.display = "none";
  loop();
})();
</script>
</body>
</html>
